<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1419; --card:#1a222c; --line:#2c3847; --text:#e8eef4; --muted:#93a4b8; --accent:#3d9cf0; --danger:#f07178; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    p.lead { color: var(--muted); margin: 0 0 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; font-size: .8rem; color: var(--muted); margin: .5rem 0 .2rem; }
    input { width: 100%; padding: .55rem .7rem; border-radius: 8px; border: 1px solid var(--line); background: #0f1419; color: var(--text); }
    button { margin-top: .75rem; border: 0; border-radius: 8px; padding: .55rem .9rem; background: var(--accent); color: #041018; font-weight: 600; cursor: pointer; }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    button.danger { background: var(--danger); color: #1a0a0c; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .err { color: var(--danger); font-size: .85rem; min-height: 1.2rem; }
    .ok { color: #7fd99a; font-size: .9rem; word-break: break-all; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border-top: 1px solid var(--line); padding: .75rem 0; }
    li:first-child { border-top: 0; }
    code { font-size: .85rem; }
    .muted { color: var(--muted); font-size: .8rem; }
    .bar { height: 8px; background: #2a6ea8; border-radius: 4px; margin: .2rem 0 .6rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>URL Shortener</h1>
  <p class="lead">Encurte URLs, copie o link e veja analytics da sua conta.</p>

  <section id="auth" class="card">
    <div class="row">
      <button type="button" id="tab-login">Entrar</button>
      <button type="button" class="ghost" id="tab-register">Criar conta</button>
    </div>
    <label>Email <input id="email" type="email" autocomplete="username"></label>
    <label>Senha <input id="password" type="password" autocomplete="current-password"></label>
    <button type="button" id="auth-go">Continuar</button>
    <div class="err" id="auth-err"></div>
  </section>

  <section id="app" class="card" hidden>
    <div class="row">
      <span class="muted" id="who"></span>
      <button type="button" class="ghost" id="logout">Sair</button>
    </div>
    <label>URL longa <input id="url" placeholder="https://example.com/caminho"></label>
    <label>Alias (opcional) <input id="alias" placeholder="mylink"></label>
    <label>Expira em (RFC3339, opcional) <input id="expires" placeholder="2027-01-01T00:00:00Z"></label>
    <button type="button" id="create">Encurtar</button>
    <div class="ok" id="created"></div>
    <div class="err" id="create-err"></div>
    <h2 class="muted">Seus links</h2>
    <ul id="links"></ul>
    <div id="stats"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let mode = "login";
const tokenKey = "us_token";
const emailKey = "us_email";

function token() { return localStorage.getItem(tokenKey) || ""; }
function headers() {
  const h = { "Content-Type": "application/json" };
  if (token()) h.Authorization = "Bearer " + token();
  return h;
}
async function api(path, opts={}) {
  const res = await fetch(path, { ...opts, headers: { ...headers(), ...(opts.headers||{}) } });
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch {}
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function showApp() {
  $("auth").hidden = true;
  $("app").hidden = false;
  $("who").textContent = localStorage.getItem(emailKey) || "";
  loadLinks();
}
function showAuth() {
  $("auth").hidden = false;
  $("app").hidden = true;
}

$("tab-login").onclick = () => { mode = "login"; $("tab-login").className = ""; $("tab-register").className = "ghost"; };
$("tab-register").onclick = () => { mode = "register"; $("tab-register").className = ""; $("tab-login").className = "ghost"; };
$("auth-go").onclick = async () => {
  $("auth-err").textContent = "";
  try {
    const path = mode === "register" ? "/auth/register" : "/auth/login";
    const data = await api(path, { method: "POST", body: JSON.stringify({ email: $("email").value, password: $("password").value }) });
    localStorage.setItem(tokenKey, data.access_token);
    localStorage.setItem(emailKey, data.email);
    showApp();
  } catch (e) { $("auth-err").textContent = e.message; }
};
$("logout").onclick = () => { localStorage.clear(); showAuth(); };
$("create").onclick = async () => {
  $("create-err").textContent = "";
  $("created").textContent = "";
  const body = { url: $("url").value };
  if ($("alias").value) body.alias = $("alias").value;
  if ($("expires").value) body.expires_at = $("expires").value;
  try {
    const data = await api("/links", { method: "POST", body: JSON.stringify(body) });
    $("created").textContent = data.short_url;
    await navigator.clipboard.writeText(data.short_url).catch(() => {});
    loadLinks();
  } catch (e) { $("create-err").textContent = e.message; }
};

async function loadLinks() {
  const data = await api("/links");
  const ul = $("links");
  ul.innerHTML = "";
  (data.links || []).forEach((l) => {
    const li = document.createElement("li");
    li.innerHTML = `<div><a href="${l.short_url}" target="_blank" rel="noopener"><code>${l.short_url}</code></a>
      <div class="muted">${l.original_url} · ${l.is_active ? "ativo" : "inativo"}</div></div>`;
    const row = document.createElement("div");
    row.className = "row";
    const an = document.createElement("button");
    an.textContent = "Analytics";
    an.onclick = () => showStats(l.short_code);
    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "Desativar";
    del.disabled = !l.is_active;
    del.onclick = async () => {
      await api("/links/" + l.short_code, { method: "DELETE" });
      loadLinks();
    };
    row.append(an, del);
    li.appendChild(row);
    ul.appendChild(li);
  });
}

async function showStats(code) {
  const s = await api("/links/" + code + "/analytics");
  const max = Math.max(1, ...(s.clicks_by_day || []).map(d => d.count));
  const days = (s.clicks_by_day || []).map(d =>
    `<div class="muted">${d.day} · ${d.count}</div><div class="bar" style="width:${Math.round(100*d.count/max)}%"></div>`
  ).join("");
  $("stats").innerHTML = `<div class="card"><strong>${s.total_clicks}</strong> cliques
    ${days || "<p class='muted'>Sem cliques ainda.</p>"}</div>`;
}

if (token()) showApp();
</script>
</body>
</html>
