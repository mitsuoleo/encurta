# Produção (VM Azure). Não publique Postgres/Redis.
# Uso: docker compose -f docker-compose.prod.yml --env-file .env up --build -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - redisdata:/data

  api:
    build: .
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://shortener:${POSTGRES_PASSWORD}@postgres:5432/shortener?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      IP_HASH_SALT: ${IP_HASH_SALT}
      JWT_SECRET: ${JWT_SECRET}
      MIGRATIONS_PATH: file:///migrations
      RATE_LIMIT_CREATE_PER_HOUR: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
